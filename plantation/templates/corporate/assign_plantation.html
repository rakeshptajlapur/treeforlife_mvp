{% extends 'plantation/base.html' %}
{% load static %}

{% block title %}Assign Plantation{% endblock %}

{% block content %}
<div class="corporate-dashboard" style="padding: 24px; max-width: 1400px; margin: 0 auto; background: #f8fafc;">
    <!-- Page Header -->
    <div class="page-header" style="background: white; border-radius: 12px; padding: 24px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
        <div class="header-content">
            <h4 style="margin: 0; color: #1e293b; display: flex; align-items: center; gap: 8px;">
                <i class="bi bi-arrow-repeat"></i> Assign Plantation
            </h4>
            <p style="margin: 8px 0 0; color: #64748b;">{{ plantation.name }}</p>
        </div>
        <div class="stats-badge" style="display: flex; gap: 12px;">
            <span style="background: #ECFDF5; color: #2ecc71; padding: 8px 16px; border-radius: 20px; font-size: 0.9rem; display: flex; align-items: center; gap: 8px;">
                <i class="bi bi-tree"></i> Plantation ID: {{ plantation.plantation_id }}
            </span>
        </div>
    </div>

    <!-- Form Container -->
    <div class="form-container" style="background: white; border-radius: 12px; padding: 32px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
        <form method="POST" style="max-width: 500px;">
            {% csrf_token %}
            <div style="margin-bottom: 24px;">
                <label style="display: block; color: #1e293b; font-weight: 500; margin-bottom: 8px;">Choose Employee</label>
                <select name="employee_id" 
                        style="width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 0.95rem; background-color: white;">
                    {% for emp in employees %}
                    <option value="{{ emp.id }}" {% if emp.user == plantation.owner %}selected{% endif %}
                            style="padding: 8px;">
                        {{ emp.user.username }} | {{ emp.user.email }} | {{ emp.user.plantation_set.count }} plantations
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div style="display: flex; gap: 12px;">
                <button type="submit" 
                        style="background: linear-gradient(45deg, #474bff, #bc48ff); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 0.95rem; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; transition: transform 0.2s ease;">
                    <i class="bi bi-check2-circle"></i> Assign
                </button>
                
                <a href="{% url 'manage_plantations' %}" 
                   style="background: #f1f5f9; color: #64748b; border: none; padding: 12px 24px; border-radius: 8px; font-size: 0.95rem; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; transition: transform 0.2s ease;">
                    <i class="bi bi-arrow-left"></i> Back
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
