<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - TreeforLife</title>
    {% load static %}
    
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/components.css' %}">
</head>
<body>
    <div class="auth-layout">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-logo">
                    <img src="{% static 'css/images/treeforlifelogo.png' %}" alt="TreeForLife" height="48">
                </div>
                <h2 class="auth-title">Reset Password</h2>
                <p class="auth-subtitle">Enter your email to receive reset instructions</p>

                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <form method="POST" class="auth-form">
                    {% csrf_token %}
                    {% load form_extras %}
                    
                    <div class="form-group">
                        <label for="id_email" class="form-label">Email</label>
                        {{ form.email|add_class:"form-input" }}
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">
                        <i class="bi bi-envelope"></i> Send Reset Link
                    </button>

                    <div class="auth-links">
                        <a href="{% url 'login' %}" class="forgot-link">
                            <i class="bi bi-arrow-left"></i> Back to Login
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
