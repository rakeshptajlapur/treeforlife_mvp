<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Complete - TreeforLife</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/components.css' %}">
</head>
<body>
    <div class="auth-layout">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-logo">
                    <img src="{% static 'css/images/treeforlifelogo.png' %}" alt="TreeForLife" height="48">
                </div>
                <h2 class="auth-title">Password Reset Successful</h2>
                <p class="auth-subtitle">Your password has been set. You may now log in.</p>
                <div class="auth-links">
                    <a href="{% url 'login' %}" class="btn btn-primary btn-block">
                        <i class="bi bi-box-arrow-in-right"></i> Login
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
