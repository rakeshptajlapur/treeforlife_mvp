<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Email Sent - TreeforLife</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/components.css' %}">
   
</head>
<body>
    <div class="auth-layout">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-logo">
                    <img src="{% static 'css/images/treeforlifelogo.png' %}" alt="TreeForLife" height="48">
                </div>
                <h2 class="auth-title">Check Your Email</h2>
                <p class="auth-subtitle">Reset instructions have been sent to your email address.</p>
                <div class="auth-links">
                    <a href="{% url 'login' %}" class="forgot-link">
                        <i class="bi bi-arrow-left"></i> Back to Login
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
